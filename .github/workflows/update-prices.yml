name: Update Prices

on:
  schedule:
    - cron: '0 1 1 * *'  # 매달 1일 01:00 UTC (10:00 KST)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Capture before SHA
        run: echo "BEFORE_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape prices
        run: python scripts/scrape_prices.py

      - name: Summarize changes
        run: |
          if [ -f price_changes.txt ]; then
            echo "### 가격 변동 내역" >> $GITHUB_STEP_SUMMARY
            cat price_changes.txt >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git add HISTORY.md || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "$(printf 'chore: 월간 가격 수집 %s\n\n%s\n\nTEST=automated scrape' \
              "$(date -u '+%Y-%m-%d')" \
              "$(cat price_changes.txt 2>/dev/null || echo '변동 없음')")"
            git push
          fi

      - name: Cleanup temp file
        if: always()
        run: rm -f price_changes.txt
