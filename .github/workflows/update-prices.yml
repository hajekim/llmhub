name: Update Prices

on:
  schedule:
    - cron: '0 0 * * 1'  # 매주 월요일 00:00 UTC
  workflow_dispatch:       # 수동 실행 가능

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape prices
        run: python scripts/scrape_prices.py

      - name: Check for changes
        id: changes
        run: |
          if [ -f price_changes.txt ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "### 가격 변동 내역" >> $GITHUB_STEP_SUMMARY
            cat price_changes.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "$(printf 'chore: update prices\n\n%s\n\nTEST=automated scrape' "$(cat price_changes.txt)")"
          git push

      - name: Cleanup temp file
        if: always()
        run: rm -f price_changes.txt
